name: No-Mistake v1 – CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend – Lint & Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Compile backend (syntax check)
        run: |
          python -m compileall app

  docker-build:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: no-mistake-autotrader/backend:ci

      - name: Build frontend image (nginx static)
        run: |
          docker build -t no-mistake-autotrader/frontend:ci -f- . <<'DOCKERFILE'
          FROM nginx:stable-alpine
          COPY frontend /usr/share/nginx/html
          DOCKERFILE
