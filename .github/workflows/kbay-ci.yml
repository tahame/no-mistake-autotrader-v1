name: K-BAY CI

on:
  push:
    paths: ['kbay/**', '.github/workflows/kbay-ci.yml']
  pull_request:
    paths: ['kbay/**', '.github/workflows/kbay-ci.yml']

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kbay
          POSTGRES_PASSWORD: kbay
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kbay" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: kbay/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kbay/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kbay/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kbay/web/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kbay-app:ci kbay
