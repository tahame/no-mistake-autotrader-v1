version: "3.9"

services:
  db:
    image: postgres:15
    container_name: no_mistake_v1_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=no_mistake_v1
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: no_mistake_v1_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/no_mistake_v1
      - SECRET_KEY=CHANGE_ME_SUPER_SECRET_KEY
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: nginx:stable-alpine
    container_name: no_mistake_v1_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
