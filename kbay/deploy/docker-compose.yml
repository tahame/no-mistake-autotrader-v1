# K-BAY on its own: its own project name, network, database and volumes. Nothing here touches
# the other sites on the server. The app listens only on 127.0.0.1; Caddy is the only way in.
name: kbay

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kbay
      POSTGRES_USER: kbay_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbay_owner -d kbay"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kbay-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kbay_app:${APP_DB_PASSWORD}@db:5432/kbay
      DATABASE_ADMIN_URL: postgres://kbay_owner:${POSTGRES_PASSWORD}@db:5432/kbay
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8080"
    networks: [internal, edge]

  # Nightly compressed dump, kept for BACKUP_KEEP_DAYS days, in ./backups on the host.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: kbay_owner
      PGDATABASE: kbay
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_AT_UTC_HOUR: ${BACKUP_AT_UTC_HOUR:-22}
    volumes:
      - ./backups:/backups
      - ./backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    networks: [internal]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  db_data:
